[project]
name = "mmsim"
version = "0.1.0"
description = "Market making under inventory risk and adverse selection: Avellaneda-Stoikov vs informed traders"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7", "pandas>=2.0"]

[project.optional-dependencies]
test = ["pytest>=7"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mmsim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
